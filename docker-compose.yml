services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cims
      POSTGRES_PASSWORD: cims
      POSTGRES_DB: cims
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d   # creates the test database
volumes:
  pgdata:
